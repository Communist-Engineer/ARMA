[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "amra-cloud"
version = "0.1.0"
description = "Verification-first substrate for the Exact Adaptive Multiscale Representation Atlas"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE.md" }
authors = [{ name = "Communist-Engineer" }]
keywords = ["SAT", "formal-methods", "reproducibility", "ethical-source-available"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "opentelemetry-api>=1.36,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rfc8785>=0.1.4,<0.2",
  "sqlalchemy>=2.0,<3",
  "temporalio>=1.15,<2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "cyclonedx-bom>=7.1,<8",
  "httpx>=0.28,<1",
  "hypothesis>=6.138,<7",
  "jsonschema[format]>=4.25,<5",
  "pip-audit>=2.9,<3",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
amra = "amra.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amra"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnusedFunction = "none"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=amra --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "integration: requires local services or external proof tools",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["amra"]
omit = ["src/amra/adapters/postgres/alembic/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  '\.\.\.',
]
