name: phase1-verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_DB: amra
          POSTGRES_PASSWORD: amra
          POSTGRES_USER: amra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amra -d amra"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      AMRA_TEST_DATABASE_URL: postgresql+psycopg://amra:amra@127.0.0.1:5432/amra
      AMRA_TEST_S3_ACCESS_KEY: amra
      AMRA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      AMRA_TEST_S3_SECRET_KEY: amra-phase1-local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.7
      - name: Install exact uv
        run: python -m pip install --disable-pip-version-check uv==0.11.33
      - name: Locked environment
        run: uv sync --locked --python 3.14.7
      - name: Build pinned proof toolchain
        run: ./scripts/build_toolchain.sh
      - name: Start pinned MinIO service
        run: |
          docker run --detach --name amra-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=amra \
            --env MINIO_ROOT_PASSWORD=amra-phase1-local \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
      - name: Wait for MinIO
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:9000/minio/health/live", timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("MinIO readiness timeout")
          PY
      - name: Format, lint, and strict typing
        run: |
          uv run ruff format --check src tests scripts
          uv run ruff check src tests scripts
          uv run pyright src
      - name: Contracts, secrets, and SBOM
        run: |
          uv run python scripts/generate_sbom.py
          uv run python scripts/validate_contracts.py
          uv run python scripts/secret_scan.py
          git diff --exit-code -- uv.lock sbom
      - name: Vulnerability audit
        run: |
          uv export --locked --no-dev --no-emit-project -o build/runtime-requirements.txt
          uv run pip-audit --strict --progress-spinner=off -r build/runtime-requirements.txt
      - name: Test trust loop
        run: |
          uv run pytest
          uv run coverage json -o build/coverage.json
          uv run python scripts/check_critical_coverage.py

  proof-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build source-pinned isolated images
        run: |
          docker build -f containers/Dockerfile.solver -t amra/cadical:phase1 .
          docker build -f containers/Dockerfile.converter -t amra/drat-trim:phase1 .
          docker build -f containers/Dockerfile.checker -t amra/cake-lpr:phase1 .
      - name: Exercise separated proof boundary
        run: |
          mkdir -p build/proof-image-test
          chmod 0777 build/proof-image-test
          cp tests/fixtures/unsat.cnf build/proof-image-test/input.cnf
          solver_exit=0
          docker run --rm --network=none --read-only --cpus=1 --memory=512m --pids-limit=32 -v "$PWD/build/proof-image-test:/work" amra/cadical:phase1 /work/input.cnf /work/output.drat || solver_exit=$?
          test "$solver_exit" -eq 20
          docker run --rm --network=none --read-only --cpus=1 --memory=512m --pids-limit=32 -v "$PWD/build/proof-image-test:/work" amra/drat-trim:phase1 /work/input.cnf /work/output.drat -L /work/output.lrat
          docker run --rm --network=none --read-only --cpus=1 --memory=512m --pids-limit=32 -v "$PWD/build/proof-image-test:/work" amra/cake-lpr:phase1 --CML_HEAP_SIZE=128 --CML_STACK_SIZE=128 /work/input.cnf /work/output.lrat | tee build/proof-image-test/checker.txt
          grep -F "s VERIFIED UNSAT" build/proof-image-test/checker.txt
      - name: Record image identities
        run: |
          docker image inspect --format='{{.RepoTags}} {{.Id}}' amra/cadical:phase1 amra/drat-trim:phase1 amra/cake-lpr:phase1 | tee proof-image-identities.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-image-identities
          path: proof-image-identities.txt
